<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BolKhata</title><style>body{font-family:sans-serif;background:#f4f6f8;padding:16px;margin:0}.box{max-width:460px;margin:auto;background:#fff;padding:20px;border-radius:14px}h1{margin:0;color:#0f766e}.card{background:#0f766e;color:#fff;padding:14px;border-radius:10px;margin:14px 0}.btn{background:#0d9488;color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer;margin:4px 2px}.item{border:1px solid #e5e7eb;padding:10px;border-radius:8px;margin-top:8px}</style></head><body><div class="box"><h1>BolKhata</h1><p>Bol kar apna udhar aur daily hisaab likhein</p><div class="card"><div>Total Baaki</div><h2 id="bal">₹120</h2></div><button class="btn" onclick="say('Ramesh kirana se 120 ka doodh udhar')">🎤 Ramesh ₹120 Udhar</button><button class="btn" onclick="say('Ramesh ko 50 de diye')">₹50 Paid</button><button class="btn" onclick="ask()">Kitna Baaki?</button><p id="msg">Mic ya button dabayein</p><div id="list"></div></div><script>let d=JSON.parse(localStorage.getItem('bk'))||[{s:'Ramesh Kirana',a:120,t:'udhar'}];function show(){let due=d.reduce((x,y)=>y.t==='udhar'?x+y.a:x-y.a,0);document.getElementById('bal').innerText='₹'+Math.max(0,due);document.getElementById('list').innerHTML=d.map(x=>`<div class="item"><b>${x.s}</b> — ₹${x.a} (${x.t})</div>`).join('')}function speak(t){document.getElementById('msg').innerText=t;if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}function say(txt){let n=parseInt(txt.match(/\d+/)[0]);let t=txt.includes('de diye')?'paid':'udhar';d.unshift({s:'Ramesh Kirana',a:n,t});localStorage.setItem('bk',JSON.stringify(d));show();speak('Save ho gaya: ₹'+n+' '+t)}function ask(){let due=d.reduce((x,y)=>y.t==='udhar'?x+y.a:x-y.a,0);speak('Ramesh ka '+Math.max(0,due)+' rupaye baaki hai')}show()</script></body></html>
